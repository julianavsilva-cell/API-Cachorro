<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Cachorro Aleatório</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: #ad1457;
        }
        button {
            background-color: #ec407a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ad1457;
        }
        img {
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🐶 Buscar Cachorro</h1>
    <p>Clique no botão para ver um cachorrinho aleatório!</p>
    <button id="buscar">Mostrar cachorro</button>
    <div>
        <img id="cachorro" alt="Foto aleatória" width="300" height="200">
    </div>
    <script src="script.js"></script>
</body>
</html>
